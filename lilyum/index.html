<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf4f3">
  <meta name="description" content="Lilyum Buketi Kendin Yap Seti: yapım videosunu izle veya ürünü online sipariş ver.">
  <title>Lilyum Buketi | Kendin Yap Seti</title>
  <style>
    :root{
      --ink:#191416;
      --muted:#75686c;
      --accent:#b8434d;
      --accent-dark:#91343d;
      --soft:#f8e9eb;
      --paper:#fff;
      --line:#efd9dc;
      --shadow:0 22px 60px rgba(105,45,52,.14);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{
      min-height:100svh;display:grid;place-items:center;padding:24px;color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%,rgba(205,96,108,.16),transparent 30%),
        radial-gradient(circle at 90% 92%,rgba(230,170,176,.18),transparent 32%),
        linear-gradient(180deg,#fdfafa 0%,#f8efef 100%);
    }
    .shell{width:min(100%,470px)}
    .card{position:relative;overflow:hidden;background:rgba(255,255,255,.97);border:1px solid rgba(145,52,61,.18);border-radius:34px;padding:30px 24px 24px;box-shadow:var(--shadow)}
    .card:before,.card:after{content:"";position:absolute;border-radius:50%;pointer-events:none;background:rgba(184,67,77,.07)}
    .card:before{width:170px;height:170px;top:-95px;left:-75px}
    .card:after{width:190px;height:190px;right:-95px;bottom:-105px}
    .content{position:relative;z-index:1;text-align:center}
    .brand{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:var(--soft);color:var(--accent-dark);font-size:12px;font-weight:900;letter-spacing:.15em}
    h1{margin:16px 0 0;font-size:46px;line-height:.93;letter-spacing:-.045em;font-weight:950}
    .sub{margin:14px 0 0;color:var(--muted);font-size:20px;font-weight:750}
    .rule{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px auto 20px}
    .rule:before,.rule:after{content:"";height:1px;width:46px;background:var(--line)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .question{margin:0 0 17px;color:#51464a;font-size:17px;font-weight:650}
    .actions{display:grid;gap:13px}
    .btn{min-height:66px;width:100%;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;padding:15px 18px;text-decoration:none;font-size:19px;font-weight:900;letter-spacing:-.01em;border:2px solid transparent;transition:transform .12s ease,box-shadow .12s ease}
    .btn:active{transform:scale(.985)}
    .primary{color:#fff;background:linear-gradient(180deg,#c7515b 0%,#9c3842 100%);box-shadow:0 12px 26px rgba(145,52,61,.24)}
    .secondary{color:var(--ink);background:#fff;border-color:#ead0d4}
    .icon{width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px}
    .icon svg{width:23px;height:23px;display:block}
    .note{margin:21px 0 0;color:#8d8184;font-size:13px;line-height:1.4}
    .trust{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px;color:#9d9295;font-size:11px}
    .trust-dot{width:5px;height:5px;border-radius:50%;background:#d0a7ab}
    @media(max-width:420px){body{padding:18px}.card{padding:27px 18px 21px;border-radius:29px}h1{font-size:41px}.sub{font-size:18px}.btn{font-size:18px;min-height:62px}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Lilyum Buketi Kendin Yap Seti">
      <div class="content">
        <div class="brand">✦ ŞÖNİL HOBİ KİTİ ✦</div>
        <h1>LİLYUM<br>BUKETİ</h1>
        <p class="sub">Kendin Yap Seti</p>
        <div class="rule"><span class="dot"></span></div>
        <p class="question">Ne yapmak istiyorsun?</p>
        <div class="actions">
          <a class="btn primary" href="https://youtu.be/KbhND7csyuU" target="_blank" rel="noopener">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none"><path d="M8 6.7v10.6L17 12 8 6.7Z" fill="currentColor"/></svg>
            </span>
            <span>Yapım Videosunu İzle</span>
          </a>
          <a class="btn secondary" href="https://www.shopier.com/ciceksonil_malzmlr/51629461" target="_blank" rel="noopener">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16l-1.5 8.5H7L5.6 4H3"/><circle cx="8.5" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/>
              </svg>
            </span>
            <span>Online Sipariş Ver</span>
          </a>
        </div>
        <p class="note">Lilyum Buketi Kendin Yap Seti</p>
        <div class="trust"><span class="trust-dot"></span><span>Yapım videosu ve ürün siparişi tek yerde</span><span class="trust-dot"></span></div>
      </div>
    </section>
  </main>
</body>
</html>
