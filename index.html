<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f1fb">
  <meta name="description" content="Lavanta Buketi Kendin Yap Seti: yapım videosunu izle veya ürünü online sipariş ver.">
  <title>Lavanta Buketi | Kendin Yap Seti</title>
  <style>
    :root{
      --ink:#18141d;
      --muted:#716978;
      --lav:#8c68bd;
      --lav-dark:#6e4c9e;
      --lav-soft:#f2eaf9;
      --paper:#ffffff;
      --line:#e5d9f0;
      --shadow:0 22px 60px rgba(63,40,86,.14);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:24px;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%,rgba(173,132,221,.18),transparent 30%),
        radial-gradient(circle at 90% 92%,rgba(193,161,228,.18),transparent 32%),
        linear-gradient(180deg,#fbf9fd 0%,#f4eef8 100%);
    }
    .shell{width:min(100%,470px)}
    .card{
      position:relative;
      overflow:hidden;
      background:rgba(255,255,255,.96);
      border:1px solid rgba(110,76,158,.18);
      border-radius:34px;
      padding:30px 24px 24px;
      box-shadow:var(--shadow);
    }
    .card:before,.card:after{
      content:"";
      position:absolute;
      border-radius:50%;
      pointer-events:none;
      background:rgba(140,104,189,.07);
    }
    .card:before{width:170px;height:170px;top:-95px;left:-75px}
    .card:after{width:190px;height:190px;right:-95px;bottom:-105px}
    .content{position:relative;z-index:1;text-align:center}
    .brand{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 13px;
      border-radius:999px;
      background:var(--lav-soft);
      color:var(--lav-dark);
      font-size:12px;
      font-weight:900;
      letter-spacing:.15em;
    }
    .sprig{font-size:14px;line-height:1}
    h1{
      margin:16px 0 0;
      font-size:46px;
      line-height:.93;
      letter-spacing:-.045em;
      font-weight:950;
    }
    .sub{
      margin:14px 0 0;
      color:var(--muted);
      font-size:20px;
      font-weight:750;
    }
    .rule{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin:22px auto 20px;
    }
    .rule:before,.rule:after{content:"";height:1px;width:46px;background:var(--line)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--lav)}
    .question{
      margin:0 0 17px;
      color:#4f4756;
      font-size:17px;
      font-weight:650;
    }
    .actions{display:grid;gap:13px}
    .btn{
      min-height:66px;
      width:100%;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:15px 18px;
      text-decoration:none;
      font-size:19px;
      font-weight:900;
      letter-spacing:-.01em;
      border:2px solid transparent;
      transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
      -webkit-tap-highlight-color:transparent;
    }
    .btn:active{transform:scale(.985)}
    .primary{
      color:#fff;
      background:linear-gradient(180deg,#956fc7 0%,#7650a9 100%);
      box-shadow:0 12px 26px rgba(110,76,158,.25);
    }
    .secondary{
      color:var(--ink);
      background:#fff;
      border-color:#d9cae8;
    }
    .icon{
      width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px
    }
    .icon svg{width:23px;height:23px;display:block}
    .note{
      margin:21px 0 0;
      color:#8a818f;
      font-size:13px;
      line-height:1.4;
    }
    .trust{
      margin-top:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      color:#9a90a1;
      font-size:11px;
    }
    .trust-dot{width:5px;height:5px;border-radius:50%;background:#bba7cf}
    @media (max-width:420px){
      body{padding:18px}
      .card{padding:27px 18px 21px;border-radius:29px}
      h1{font-size:41px}
      .sub{font-size:18px}
      .btn{font-size:18px;min-height:62px}
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-label="Lavanta Buketi Kendin Yap Seti">
      <div class="content">
        <div class="brand"><span class="sprig">✦</span> ŞÖNİL HOBİ KİTİ <span class="sprig">✦</span></div>
        <h1>LAVANTA<br>BUKETİ</h1>
        <p class="sub">Kendin Yap Seti</p>

        <div class="rule"><span class="dot"></span></div>
        <p class="question">Ne yapmak istiyorsun?</p>

        <div class="actions">
          <a class="btn primary" href="https://youtu.be/I67sYvQlMMM" target="_blank" rel="noopener">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M8 6.7v10.6L17 12 8 6.7Z" fill="currentColor"/>
              </svg>
            </span>
            <span>Yapım Videosunu İzle</span>
          </a>

          <a class="btn secondary" href="https://www.shopier.com/ciceksonil_malzmlr/51623831" target="_blank" rel="noopener">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16l-1.5 8.5H7L5.6 4H3"/>
                <circle cx="8.5" cy="19" r="1.3"/>
                <circle cx="17" cy="19" r="1.3"/>
              </svg>
            </span>
            <span>Online Sipariş Ver</span>
          </a>
        </div>

        <p class="note">Lavanta Buketi Kendin Yap Seti</p>
        <div class="trust"><span class="trust-dot"></span><span>Yapım videosu ve ürün siparişi tek yerde</span><span class="trust-dot"></span></div>
      </div>
    </section>
  </main>
</body>
</html>
