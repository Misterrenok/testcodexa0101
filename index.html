<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f1fb" id="themeColor">
  <meta name="description" content="Şönil buket kendin yap seti: yapım videosunu izle veya ürünü online sipariş ver." id="metaDesc">
  <title>Kendin Yap Buket Seti</title>
  <style>
    :root{
      --ink:#18141d;
      --muted:#716978;
      --accent:#8c68bd;
      --accent-dark:#6e4c9e;
      --soft:#f2eaf9;
      --line:#e5d9f0;
      --shadow:0 22px 60px rgba(63,40,86,.14);
      --bg1:#fbf9fd;
      --bg2:#f4eef8;
      --orb1:rgba(173,132,221,.18);
      --orb2:rgba(193,161,228,.18);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{
      min-height:100svh;display:grid;place-items:center;padding:24px;color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%,var(--orb1),transparent 30%),
        radial-gradient(circle at 90% 92%,var(--orb2),transparent 32%),
        linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);
    }
    .shell{width:min(100%,470px)}
    .card{position:relative;overflow:hidden;background:rgba(255,255,255,.97);border:1px solid color-mix(in srgb,var(--accent-dark) 18%,transparent);border-radius:34px;padding:30px 24px 24px;box-shadow:var(--shadow)}
    .card:before,.card:after{content:"";position:absolute;border-radius:50%;pointer-events:none;background:color-mix(in srgb,var(--accent) 7%,transparent)}
    .card:before{width:170px;height:170px;top:-95px;left:-75px}
    .card:after{width:190px;height:190px;right:-95px;bottom:-105px}
    .content{position:relative;z-index:1;text-align:center}
    .brand{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:var(--soft);color:var(--accent-dark);font-size:12px;font-weight:900;letter-spacing:.15em}
    h1{margin:16px 0 0;font-size:46px;line-height:.93;letter-spacing:-.045em;font-weight:950}
    .sub{margin:14px 0 0;color:var(--muted);font-size:20px;font-weight:750}
    .rule{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px auto 20px}
    .rule:before,.rule:after{content:"";height:1px;width:46px;background:var(--line)}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
    .question{margin:0 0 17px;color:#51464a;font-size:17px;font-weight:650}
    .actions{display:grid;gap:13px}
    .btn{min-height:66px;width:100%;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;padding:15px 18px;text-decoration:none;font-size:19px;font-weight:900;letter-spacing:-.01em;border:2px solid transparent;transition:transform .12s ease,box-shadow .12s ease}
    .btn:active{transform:scale(.985)}
    .primary{color:#fff;background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dark) 100%);box-shadow:0 12px 26px color-mix(in srgb,var(--accent-dark) 25%,transparent)}
    .secondary{color:var(--ink);background:#fff;border-color:var(--line)}
    .icon{width:24px;height:24px;display:grid;place-items:center;flex:0 0 24px}
    .icon svg{width:23px;height:23px;display:block}
    .note{margin:21px 0 0;color:#8d8184;font-size:13px;line-height:1.4}
    .trust{margin-top:14px;display:flex;align-items:center;justify-content:center;gap:7px;color:#9d9295;font-size:11px}
    .trust-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
    @media(max-width:420px){body{padding:18px}.card{padding:27px 18px 21px;border-radius:29px}h1{font-size:41px}.sub{font-size:18px}.btn{font-size:18px;min-height:62px}}

    /* Decorations and snowfall are exclusive to ?p=kokina. */
    .holiday-decor{display:none;position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none;z-index:0}
    body.is-kokina .holiday-decor{display:block}
    .holiday-decor svg{position:absolute;display:block}
    .holiday-tl{width:128px;top:-5px;left:-5px}
    .holiday-tr{width:118px;top:0;right:-4px}
    .holiday-bl{width:118px;bottom:-2px;left:-7px}
    .holiday-br{width:110px;bottom:-3px;right:-4px}
    body.is-kokina .card{background:linear-gradient(145deg,#fff9f9 0%,#fff 53%,#fff9f7 100%);box-shadow:0 24px 65px rgba(104,50,59,.15)}
    .snowfall{display:none;position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
    body.is-kokina .snowfall{display:block}
    .snowflake{position:absolute;top:-14vh;left:var(--x);width:var(--size);height:var(--size);border-radius:50%;background:rgba(255,255,255,.96);box-shadow:0 0 2px rgba(104,76,84,.25),0 0 7px rgba(255,255,255,.8);opacity:var(--opacity);animation:snowfall var(--duration) linear var(--delay) infinite}
    @keyframes snowfall{to{transform:translate3d(var(--drift),118vh,0)}}
    @media(max-width:420px){
      .holiday-tl{width:100px}.holiday-tr{width:98px}
      .holiday-bl{width:93px}.holiday-br{width:90px}
    }
    body.is-kapisusu h1{font-size:37px;letter-spacing:-.042em}
    @media(max-width:420px){body.is-kapisusu h1{font-size:33px}}

    /* Christmas landing treatment: scoped strictly to the door-wreath product. */
    body.is-kapisusu{
      background:
        radial-gradient(circle at 13% 18%,rgba(154,55,70,.24),transparent 34%),
        radial-gradient(circle at 90% 24%,rgba(30,98,71,.22),transparent 32%),
        radial-gradient(circle at 50% 96%,rgba(183,142,111,.18),transparent 40%),
        linear-gradient(145deg,#f3e5e4 0%,#e8ede8 52%,#f8eded 100%);
      background-attachment:fixed;
    }
    body.is-kapisusu .shell{width:min(100%,510px)}
    body.is-kapisusu .card{
      padding:31px 32px 27px;
      background:linear-gradient(165deg,#fffdfa 0%,#fff 50%,#fff8f5 100%);
      border:2px solid #dfc1ad;
      box-shadow:0 25px 80px rgba(50,68,55,.20),inset 0 0 0 6px rgba(255,255,255,.8),inset 0 0 0 7px rgba(168,117,96,.15);
    }
    body.is-kapisusu .card:before{background:rgba(186,79,87,.055);width:210px;height:210px;top:-124px;left:-95px}
    body.is-kapisusu .card:after{background:rgba(69,119,75,.065);right:-116px;bottom:-125px}
    body.is-kapisusu .holiday-tl{width:143px;top:-8px;left:-8px}
    body.is-kapisusu .holiday-tr{width:132px;top:-2px;right:-5px}
    body.is-kapisusu .holiday-bl{width:120px}
    body.is-kapisusu .holiday-br{width:123px}
    body.is-kapisusu .brand{
      border:1px solid #e6c8c1;
      background:linear-gradient(110deg,#f9eae8,#fff8ec);
      color:#882d42;
      box-shadow:0 3px 12px rgba(136,45,66,.08);
      letter-spacing:.14em; padding:9px 16px
    }
    body.is-kapisusu h1{
      margin-top:16px;font-size:38px;line-height:1.05;letter-spacing:-.035em;
      color:#262329;text-wrap:balance;
    }
    body.is-kapisusu .sub{margin-top:12px;font-size:18px;color:#696064}
    .season-tag,.wreath-showcase{display:none}
    body.is-kapisusu .season-tag{
      display:inline-flex;align-items:center;justify-content:center;margin-top:14px;
      padding:6px 16px;border-radius:30px;border:1px solid #d8d4bf;
      font-size:10px;letter-spacing:.19em;color:#56775d;font-weight:900;
      background:#f6faf5;
    }
    body.is-kapisusu .wreath-showcase{
      display:flex;align-items:center;justify-content:center;max-width:390px;
      margin:3px auto 0;height:176px;filter:drop-shadow(0 5px 7px rgba(30,79,49,.13));
    }
    .wreath-showcase svg{height:100%;width:100%;overflow:visible}
    body.is-kapisusu .rule{margin:4px auto 13px}
    body.is-kapisusu .rule:before,body.is-kapisusu .rule:after{width:62px;background:#dac1af}
    body.is-kapisusu .question{color:#484047;font-weight:750;margin-bottom:16px}
    body.is-kapisusu .btn{border-radius:17px}
    body.is-kapisusu .primary{
      background:linear-gradient(115deg,#ba4153 0%,#85293d 100%);
      box-shadow:0 14px 25px rgba(142,49,64,.20);
    }
    body.is-kapisusu .primary:hover{box-shadow:0 16px 30px rgba(142,49,64,.28);transform:translateY(-1px)}
    body.is-kapisusu .secondary{background:linear-gradient(#fff,#fffdfb);border-color:#e5cdc3}
    body.is-kapisusu .note{margin-top:19px;color:#706c6b}
    body.is-kapisusu .trust{color:#87787b}
    body.is-kapisusu .snowflake{
      background:rgba(255,255,255,.93);
      border:1px solid rgba(61,91,107,.27);
      box-shadow:0 0 7px rgba(255,255,255,.85),0 1px 3px rgba(49,77,92,.30);
    }
    body.is-kapisusu .snowflake.crystal{
      width:auto!important;height:auto!important;background:none;border:0;box-shadow:none;
      font-size:19px;color:#faffff;
      text-shadow:0 1px 3px rgba(45,77,94,.5),0 0 9px rgba(255,255,255,.8);
    }
    body.is-kapisusu .snowflake.crystal:after{content:"❄"}
    @media(min-width:900px){
      body.is-kapisusu:before,body.is-kapisusu:after{
        content:"❄";position:fixed;color:rgba(255,255,255,.55);pointer-events:none;
        font-size:120px;z-index:0;text-shadow:0 2px 20px rgba(60,87,104,.13);
      }
      body.is-kapisusu:before{left:9%;top:29%}
      body.is-kapisusu:after{right:9%;bottom:18%;font-size:95px}
      body.is-kapisusu .shell{z-index:1}
    }
    @media(max-width:520px){
      body.is-kapisusu{padding:17px}
      body.is-kapisusu .card{border-radius:27px;padding:24px 18px 21px}
      body.is-kapisusu .holiday-tl{width:102px}
      body.is-kapisusu .holiday-tr{width:96px}
      body.is-kapisusu .holiday-bl{width:85px}
      body.is-kapisusu .holiday-br{width:86px}
      body.is-kapisusu h1{font-size:32px}
      body.is-kapisusu .brand{font-size:10px;padding:8px 12px}
      body.is-kapisusu .wreath-showcase{height:152px;max-width:325px}
      body.is-kapisusu .season-tag{font-size:9px}
    }
    @media(max-width:360px){body.is-kapisusu h1{font-size:29px}}
    @media(prefers-reduced-motion:reduce){body.is-kapisusu .primary:hover{transform:none}}

    @media(prefers-reduced-motion:reduce){.snowflake{animation:none;display:none}}
  </style>
</head>
